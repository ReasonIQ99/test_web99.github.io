<style>
:root{color-scheme:dark;--navy:#020b19;--blue:#08baff;--gold:#ffc52e;--white:#f6f8ff;--muted:#b9c9df}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 50% 20%,#0b2b4b 0%,#06172d 36%,var(--navy) 76%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(circle at 12% 18%,#20bfff 0 2px,transparent 3px),radial-gradient(circle at 82% 22%,#ffc52e 0 2px,transparent 3px),radial-gradient(circle at 24% 75%,#20bfff 0 2px,transparent 3px),radial-gradient(circle at 90% 78%,#ffc52e 0 2px,transparent 3px);background-size:240px 220px,310px 260px,280px 300px,350px 320px}
.wrap{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(22px,5vw,64px) 18px}
.card{width:min(100%,920px);text-align:center;margin:auto}
.brand{width:clamp(145px,25vw,225px);aspect-ratio:1;object-fit:contain;display:block;margin:0 auto clamp(22px,4vw,34px);filter:drop-shadow(0 0 22px rgba(0,174,255,.22));animation:float 5s ease-in-out infinite}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid rgba(255,197,46,.38);border-radius:999px;background:rgba(255,197,46,.07);color:#ffdc7c;font-size:.76rem;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
h1{margin:20px 0 8px;font-size:clamp(2.25rem,7.2vw,5.6rem);font-weight:900;line-height:.98;letter-spacing:.035em}
h1 .shine{background:linear-gradient(100deg,#fff 10%,#d7f5ff 42%,#ffc52e 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.domain{margin:17px 0 0;font-size:clamp(1rem,3vw,1.65rem);font-weight:500;letter-spacing:clamp(.18em,1.2vw,.42em);color:#d8e7f8}
.rule{height:1px;width:min(330px,70%);margin:25px auto;background:linear-gradient(90deg,transparent,var(--blue),var(--gold),transparent)}
.tagline{font-size:clamp(1rem,2.5vw,1.28rem);letter-spacing:.14em;font-weight:800;color:var(--muted);margin:0 0 26px}
.tagline strong{color:var(--gold)}.launch{font-size:clamp(1.12rem,3vw,1.6rem);font-weight:750;margin:0 0 8px;color:#ffe19a}
.launch small{display:block;font-size:.78rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#a9c5e4;margin-top:9px}
.contact{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px 28px;margin-top:30px;color:#c9d7e8;font-size:.98rem}
.contact a{color:#42c7ff;text-decoration:none;font-weight:650}.contact a:hover{text-decoration:underline;text-underline-offset:4px}
.founder{margin-top:15px;color:#b8c9dd;font-size:.94rem}.founder strong{color:var(--gold)}
footer{margin-top:42px;color:#6f88a5;font-size:.75rem;letter-spacing:.05em}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(max-width:480px){.wrap{padding:26px 17px}.brand{width:150px}.tagline{letter-spacing:.08em}.contact{gap:12px;flex-direction:column}footer{margin-top:30px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
